<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMax slice" role="img" aria-hidden="true" focusable="false">
  <title>富士山ラインアート（ネオン）</title>
  <defs>
    <linearGradient id="fujiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B93F5" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="fujiGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#fujiGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#fujiGlow)">
    <!-- 稜線本体 -->
    <path d="M0,300 L430,60 L472,96 L512,54 L556,96 L600,44 L648,96 L690,58 L730,96 L1200,300" stroke-width="2.4" />
    <!-- 山頂の雪冠ライン -->
    <path d="M556,96 L580,80 L600,90 L618,78 L648,96" opacity="0.9" />
    <path d="M512,54 L522,64 L534,58" opacity="0.7" />
    <!-- 裾野の等高線（装飾） -->
    <path d="M120,300 C260,250 340,240 430,220" opacity="0.4" />
    <path d="M1080,300 C960,250 880,240 790,222" opacity="0.4" />
  </g>

  <!-- 水平線（ベースライン、グロー無し） -->
  <line x1="0" y1="300" x2="1200" y2="300" stroke="url(#fujiGrad)" stroke-width="1" opacity="0.22" />

  <!-- 山頂付近の光点（回路基板風のアクセント） -->
  <g fill="#22D3EE">
    <circle cx="600" cy="44" r="2.6" opacity="0.95" />
    <circle cx="472" cy="96" r="1.6" opacity="0.6" />
    <circle cx="730" cy="96" r="1.6" opacity="0.6" />
  </g>
</svg>
