<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 56" role="img" aria-labelledby="zenkaiLogoTitle">
  <title id="zenkaiLogoTitle">ZENKAI AI パートナーズ</title>
  <defs>
    <linearGradient id="zkLogoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="zkLogoGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="9" width="36" height="36" rx="10" fill="rgba(255,255,255,0.04)" stroke="url(#zkLogoGrad)" stroke-width="1.4" />
  <g fill="none" stroke="url(#zkLogoGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#zkLogoGlow)">
    <circle cx="12" cy="33" r="2.1" fill="url(#zkLogoGrad)" stroke="none" />
    <circle cx="27" cy="33" r="2.1" fill="url(#zkLogoGrad)" stroke="none" />
    <circle cx="19.5" cy="19" r="2.4" fill="url(#zkLogoGrad)" stroke="none" />
    <line x1="12" y1="33" x2="19.5" y2="19" />
    <line x1="27" y1="33" x2="19.5" y2="19" />
    <line x1="12" y1="33" x2="27" y2="33" />
  </g>

  <text x="48" y="30" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-weight="700" font-size="21" letter-spacing="0.5" fill="#F1F5FB">ZENKAI</text>
  <text x="142" y="30" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-weight="700" font-size="21" letter-spacing="0.5" fill="url(#zkLogoGrad)">AI</text>
  <text x="48" y="46" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="500" font-size="12" letter-spacing="1.5" fill="#8891A5">パートナーズ</text>
</svg>
