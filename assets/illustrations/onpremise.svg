<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-hidden="true" focusable="false">
  <title>オンプレミスAI構築のイメージ図（サーバーラック・シールド・社内ネットワーク）</title>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景の細グリッド -->
  <g stroke="#8B93F5" stroke-width="0.5" opacity="0.10">
    <path d="M0,60 H480 M0,120 H480 M0,180 H480 M0,240 H480 M0,300 H480"/>
    <path d="M60,0 V360 M120,0 V360 M180,0 V360 M240,0 V360 M300,0 V360 M360,0 V360 M420,0 V360"/>
  </g>
  <!-- 光斑 -->
  <circle cx="150" cy="120" r="120" fill="url(#glowIndigo)"/>
  <circle cx="360" cy="230" r="110" fill="url(#glowCyan)"/>

  <!-- 社内境界（点線の囲い＝データが出ない範囲） -->
  <rect x="60" y="48" width="280" height="264" rx="16" fill="none" stroke="url(#grad)" stroke-width="1.4" stroke-dasharray="7 9" opacity="0.55"/>

  <!-- サーバーラック -->
  <g filter="url(#glow)">
    <rect x="120" y="92" width="120" height="176" rx="10" fill="rgba(99,102,241,0.10)" stroke="url(#grad)" stroke-width="2"/>
    <g stroke="url(#grad)" stroke-width="1.6" fill="none">
      <rect x="134" y="108" width="92" height="32" rx="5"/>
      <rect x="134" y="150" width="92" height="32" rx="5"/>
      <rect x="134" y="192" width="92" height="32" rx="5"/>
      <line x1="144" y1="124" x2="176" y2="124"/>
      <line x1="144" y1="166" x2="176" y2="166"/>
      <line x1="144" y1="208" x2="176" y2="208"/>
    </g>
    <g fill="#22D3EE">
      <circle cx="214" cy="124" r="2.6"/>
      <circle cx="214" cy="166" r="2.6" opacity="0.7"/>
      <circle cx="214" cy="208" r="2.6" opacity="0.85"/>
    </g>
    <!-- AIチップ表現（下段） -->
    <rect x="150" y="236" width="60" height="20" rx="4" fill="none" stroke="url(#grad)" stroke-width="1.4"/>
    <text x="180" y="250" fill="#8B93F5" font-family="Space Grotesk, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">AI</text>
  </g>

  <!-- シールド（守られていることの象徴） -->
  <g filter="url(#glow)">
    <path d="M362 96 L404 114 v44 c0 34 -18 56 -42 68 c-24 -12 -42 -34 -42 -68 v-44 z" fill="rgba(34,211,238,0.08)" stroke="url(#grad)" stroke-width="2"/>
    <path d="M344 158 l14 14 l24 -28" fill="none" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 社内端末ノード（境界内で繋がる） -->
  <g stroke="url(#grad)" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M120 180 C96 180 88 210 88 232" stroke-dasharray="3 6"/>
    <path d="M240 150 C272 140 292 128 306 120" stroke-dasharray="3 6"/>
    <path d="M240 220 C270 232 288 244 300 252" stroke-dasharray="3 6"/>
  </g>
  <g filter="url(#glow)" stroke="url(#grad)" stroke-width="1.6" fill="rgba(99,102,241,0.10)">
    <rect x="74" y="232" width="30" height="20" rx="3"/>
    <rect x="300" y="104" width="28" height="20" rx="3"/>
    <rect x="294" y="248" width="30" height="20" rx="3"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="89" cy="242" r="1.6"/>
    <circle cx="314" cy="114" r="1.6"/>
    <circle cx="309" cy="258" r="1.6"/>
  </g>

  <!-- 外部クラウド（境界の外・接続なしを示す） -->
  <g stroke="#64748B" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M398 268 a12 12 0 0 1 6 -22 a16 16 0 0 1 30 4 a11 11 0 0 1 -3 22 z"/>
    <line x1="404" y1="282" x2="430" y2="256" stroke="#E0A458" stroke-width="1.8" opacity="0.8"/>
  </g>
</svg>
