<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax meet" role="img" aria-hidden="true" focusable="false">
  <title>富士山ワイヤーフレーム（デジタルメッシュ）</title>
  <defs>
    <linearGradient id="fujiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B93F5" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="fujiGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05" />
    </linearGradient>
    <filter id="fujiGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .fj-dot { animation: fjPulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .fj-dot.d2 { animation-delay: 0.9s; }
      .fj-dot.d3 { animation-delay: 1.7s; }
      .fj-rise { animation: fjRise 7s linear infinite; }
      .fj-rise.r2 { animation-delay: 2.3s; }
      .fj-rise.r3 { animation-delay: 4.6s; }
      @keyframes fjPulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes fjRise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-110px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .fj-dot, .fj-rise { animation: none; } }
    </style>
  </defs>

  <!-- 稜線本体：どっしりした山体
       ・山頂の幅を広く（火口縁 600→840）、中腹も太く、傾斜は緩やかに
       ・裾野は画面いっぱいに広がる -->
  <g fill="none" stroke="url(#fujiGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#fujiGlow)">
    <path d="M40,380
             C300,362 440,322 520,242
             C562,200 582,150 600,116
             L624,106 L652,112 L682,100 L712,110 L740,102 L768,112 L796,105 L818,112 L840,116
             C858,150 878,200 920,242
             C1000,322 1140,362 1400,380"
          stroke-width="2.6" />
    <!-- 雪形ライン（山頂直下、指状に垂れる雪の縁） -->
    <path d="M580,195 L610,165 L632,205 L660,172 L688,212 L716,175 L744,214 L772,175 L798,208 L826,170 L852,196"
          opacity="0.8" stroke-width="1.8" />
    <path d="M640,212 L636,248" opacity="0.45" stroke-width="1.4" />
    <path d="M744,222 L748,258" opacity="0.45" stroke-width="1.4" />
  </g>

  <!-- 内部ワイヤーフレーム（ローポリ三角メッシュ＝デジタル進化風） -->
  <g fill="none" stroke="url(#fujiGrad)" stroke-width="1" opacity="0.38">
    <path d="M600,116 L560,255 M624,106 L560,255 M682,100 L660,245 M652,112 L660,245 M740,102 L760,242 M712,110 L760,242 M818,112 L860,250 M796,105 L860,250 M840,116 L860,250
             M560,255 L660,245 L760,242 L860,250
             M520,242 L560,255 M920,242 L860,250
             M560,255 L480,335 M560,255 L640,330 M660,245 L640,330 M660,245 L720,332 M760,242 L720,332 M760,242 L800,332 M860,250 L800,332 M860,250 L960,338
             M520,242 L480,335 M920,242 L960,338
             M480,335 L240,380 M480,335 L520,380 M640,330 L520,380 M640,330 L760,380 M720,332 L760,380 M800,332 L760,380 M800,332 L1000,380 M960,338 L1000,380 M960,338 L1240,380" />
  </g>

  <!-- メッシュ面のうっすら光る面（数枚だけ） -->
  <g stroke="none">
    <polygon points="652,112 682,100 660,245" fill="url(#fujiGradV)" opacity="0.30" />
    <polygon points="712,110 740,102 760,242" fill="url(#fujiGradV)" opacity="0.34" />
    <polygon points="796,105 818,112 860,250" fill="url(#fujiGradV)" opacity="0.22" />
    <polygon points="560,255 660,245 640,330" fill="url(#fujiGradV)" opacity="0.14" />
    <polygon points="760,242 860,250 800,332" fill="url(#fujiGradV)" opacity="0.12" />
  </g>

  <!-- 水平線（ベースライン） -->
  <line x1="0" y1="380" x2="1440" y2="380" stroke="url(#fujiGrad)" stroke-width="1" opacity="0.22" />
  <!-- デジタル等高線（破線スキャンライン） -->
  <g stroke="url(#fujiGrad)" stroke-width="1" fill="none" opacity="0.20" stroke-dasharray="6 10">
    <path d="M260,330 L1180,330" />
    <path d="M400,265 L1050,265" />
    <path d="M520,195 L920,195" />
  </g>

  <!-- 頂点ノード（発光ドット、ゆっくり明滅） -->
  <g fill="#22D3EE">
    <circle class="fj-dot" cx="682" cy="100" r="3" />
    <circle class="fj-dot d2" cx="600" cy="116" r="2" />
    <circle class="fj-dot d3" cx="840" cy="116" r="2" />
    <circle class="fj-dot d2" cx="520" cy="242" r="1.8" opacity="0.7" />
    <circle class="fj-dot d3" cx="920" cy="242" r="1.8" opacity="0.7" />
    <circle class="fj-dot" cx="560" cy="255" r="1.6" opacity="0.6" />
    <circle class="fj-dot d2" cx="760" cy="242" r="1.6" opacity="0.6" />
    <circle class="fj-dot d3" cx="860" cy="250" r="1.6" opacity="0.6" />
    <circle class="fj-dot" cx="640" cy="330" r="1.4" opacity="0.5" />
    <circle class="fj-dot d3" cx="960" cy="338" r="1.4" opacity="0.5" />
  </g>

  <!-- 進化エフェクト：山頂から立ち上るデータ粒子 -->
  <g fill="#8B93F5">
    <circle class="fj-rise" cx="700" cy="88" r="1.8" />
    <circle class="fj-rise r2" cx="756" cy="92" r="1.4" />
    <circle class="fj-rise r3" cx="664" cy="94" r="1.2" />
  </g>
</svg>
