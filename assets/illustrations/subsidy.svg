<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-hidden="true" focusable="false">
  <title>補助金申請サポートのイメージ図（申請書類・認定スタンプ・助成）</title>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="90" cy="80" r="130" fill="url(#glowIndigo)"/>
  <circle cx="400" cy="300" r="150" fill="url(#glowCyan)"/>

  <path d="M0,0L0,360M40,0L40,360M80,0L80,360M120,0L120,360M160,0L160,360M200,0L200,360M240,0L240,360M280,0L280,360M320,0L320,360M360,0L360,360M400,0L400,360M440,0L440,360M480,0L480,360M0,0L480,0M0,40L480,40M0,80L480,80M0,120L480,120M0,160L480,160M0,200L480,200M0,240L480,240M0,280L480,280M0,320L480,320M0,360L480,360" stroke="#8B93F5" stroke-width="1" opacity="0.06"/>

  <!-- 申請書類 -->
  <g filter="url(#glow)">
    <path d="M92,58 h146 l40,40 v182 a8,8 0 0 1 -8,8 h-178 a8,8 0 0 1 -8,-8 v-214 a8,8 0 0 1 8,-8 z"
          fill="rgba(255,255,255,0.03)" stroke="url(#grad)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M238,58 v32 a8,8 0 0 0 8,8 h32" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g stroke="#B4BDCF" stroke-width="1.8" opacity="0.7" stroke-linecap="round">
    <line x1="112" y1="126" x2="222" y2="126"/>
    <line x1="112" y1="144" x2="240" y2="144"/>
    <line x1="112" y1="162" x2="200" y2="162"/>
    <line x1="112" y1="188" x2="222" y2="188"/>
    <line x1="112" y1="206" x2="180" y2="206"/>
  </g>
  <rect x="112" y="230" width="60" height="16" rx="3" fill="none" stroke="url(#grad)" stroke-width="1.6" opacity="0.6"/>

  <!-- 認定スタンプ -->
  <g transform="rotate(-12 300 246)" filter="url(#glow)">
    <circle cx="300" cy="246" r="48" fill="rgba(34,211,238,0.08)" stroke="url(#grad)" stroke-width="3"/>
    <circle cx="300" cy="246" r="34" fill="none" stroke="url(#grad)" stroke-width="1.6" opacity="0.7"/>
    <path d="M282,246 l12,14 l24,-30" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g stroke="url(#grad)" stroke-width="1.4" opacity="0.5">
    <path d="M300,190 l0,10 M300,282 l0,10 M244,246 l10,0 M336,246 l10,0 M262,208 l7,7 M331,208 l-7,7 M262,284 l7,-7 M331,284 l-7,-7" />
  </g>

  <!-- 助成金アクセント（円マーク・図形化） -->
  <g filter="url(#glow)">
    <circle cx="380" cy="110" r="40" fill="url(#glowCyan)" opacity="0.5"/>
  </g>
  <g stroke="url(#grad)" stroke-width="3.4" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M360,80 L380,112 L400,80"/>
    <line x1="380" y1="112" x2="380" y2="146"/>
    <line x1="366" y1="120" x2="394" y2="120"/>
    <line x1="366" y1="132" x2="394" y2="132"/>
  </g>
</svg>
