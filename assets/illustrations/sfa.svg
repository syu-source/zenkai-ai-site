<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-hidden="true" focusable="false">
  <title>オーダーメイドSFA構築のイメージ図（商談ファネル・グラフ・名刺）</title>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="90" cy="60" r="130" fill="url(#glowIndigo)"/>
  <circle cx="410" cy="300" r="150" fill="url(#glowCyan)"/>

  <path d="M0,0L0,360M40,0L40,360M80,0L80,360M120,0L120,360M160,0L160,360M200,0L200,360M240,0L240,360M280,0L280,360M320,0L320,360M360,0L360,360M400,0L400,360M440,0L440,360M480,0L480,360M0,0L480,0M0,40L480,40M0,80L480,80M0,120L480,120M0,160L480,160M0,200L480,200M0,240L480,240M0,280L480,280M0,320L480,320M0,360L480,360" stroke="#8B93F5" stroke-width="1" opacity="0.06"/>

  <!-- 商談ファネル -->
  <g filter="url(#glow)">
    <path d="M110,58 h180 l-56,86 v34 l-68,20 v-54 z" fill="rgba(99,102,241,0.10)" stroke="url(#grad)" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <line x1="110" y1="58" x2="290" y2="58" stroke="url(#grad)" stroke-width="1.4" opacity="0.5"/>
  <line x1="140" y1="106" x2="260" y2="106" stroke="url(#grad)" stroke-width="1.2" opacity="0.35"/>
  <line x1="165" y1="150" x2="235" y2="150" stroke="url(#grad)" stroke-width="1.2" opacity="0.3"/>

  <!-- リード（見込み客）の粒 -->
  <g fill="#22D3EE" filter="url(#glow)">
    <circle cx="150" cy="80" r="4.5" opacity="0.9"/>
    <circle cx="200" cy="88" r="3.6" opacity="0.7"/>
    <circle cx="230" cy="128" r="3" opacity="0.6"/>
    <circle cx="200" cy="188" r="3.6" opacity="0.9"/>
  </g>

  <!-- コンバージョン矢印 -->
  <g stroke="url(#grad)" stroke-width="1.6" opacity="0.5" stroke-dasharray="2 6" fill="none">
    <path d="M204,214 C240,238 280,252 306,262"/>
  </g>
  <path d="M298,254 l14,4 l-6,13" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- 実績グラフ -->
  <g stroke="url(#grad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <line x1="300" y1="300" x2="440" y2="300"/>
  </g>
  <g stroke="url(#grad)" stroke-width="2" fill="rgba(99,102,241,0.10)">
    <rect x="308" y="256" width="20" height="44" rx="3"/>
    <rect x="340" y="234" width="20" height="66" rx="3"/>
    <rect x="372" y="204" width="20" height="96" rx="3"/>
    <rect x="404" y="182" width="20" height="118" rx="3" fill="rgba(34,211,238,0.14)"/>
  </g>

  <!-- 名刺 -->
  <g filter="url(#glow)">
    <rect x="46" y="228" width="140" height="80" rx="10" fill="rgba(255,255,255,0.04)" stroke="url(#grad)" stroke-width="2"/>
  </g>
  <circle cx="76" cy="258" r="14" fill="rgba(99,102,241,0.16)" stroke="url(#grad)" stroke-width="1.8"/>
  <g stroke="#B4BDCF" stroke-width="1.8" opacity="0.75" stroke-linecap="round">
    <line x1="100" y1="252" x2="164" y2="252"/>
    <line x1="100" y1="264" x2="150" y2="264"/>
    <line x1="62" y1="286" x2="170" y2="286"/>
  </g>
</svg>
