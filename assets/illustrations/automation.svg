<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-hidden="true" focusable="false">
  <title>業務自動化ツール開発のイメージ図（帳票・アーム・ライン）</title>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="70" cy="60" r="130" fill="url(#glowIndigo)"/>
  <circle cx="420" cy="300" r="150" fill="url(#glowCyan)"/>

  <path d="M0,0L0,360M40,0L40,360M80,0L80,360M120,0L120,360M160,0L160,360M200,0L200,360M240,0L240,360M280,0L280,360M320,0L320,360M360,0L360,360M400,0L400,360M440,0L440,360M480,0L480,360M0,0L480,0M0,40L480,40M0,80L480,80M0,120L480,120M0,160L480,160M0,200L480,200M0,240L480,240M0,280L480,280M0,320L480,320M0,360L480,360" stroke="#8B93F5" stroke-width="1" opacity="0.06"/>

  <!-- ベルトコンベア -->
  <line x1="40" y1="292" x2="440" y2="292" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="40" y1="306" x2="440" y2="306" stroke="url(#grad)" stroke-width="1.2" opacity="0.3"/>
  <g stroke="#22D3EE" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <path d="M150,299 l8,-7 l8,7"/>
    <path d="M230,299 l8,-7 l8,7"/>
    <path d="M310,299 l8,-7 l8,7"/>
  </g>

  <!-- 入力書類（束） -->
  <g stroke="url(#grad)" stroke-width="2" stroke-linejoin="round" filter="url(#glow)">
    <rect x="56" y="252" width="58" height="34" rx="4" fill="rgba(255,255,255,0.03)"/>
    <rect x="62" y="244" width="58" height="34" rx="4" fill="rgba(255,255,255,0.05)"/>
    <rect x="68" y="236" width="58" height="34" rx="4" fill="rgba(99,102,241,0.10)"/>
  </g>
  <g stroke="#B4BDCF" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
    <line x1="78" y1="248" x2="112" y2="248"/>
    <line x1="78" y1="258" x2="104" y2="258"/>
  </g>

  <!-- ロボットアーム -->
  <g fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <rect x="222" y="292" width="46" height="16" rx="4" fill="rgba(99,102,241,0.12)" stroke-width="2"/>
    <path d="M245,292 L245,258"/>
    <path d="M245,258 L188,196"/>
    <path d="M188,196 L172,158"/>
  </g>
  <g stroke="url(#grad)" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M172,158 l-14,-6 M172,158 l6,-15"/>
  </g>
  <circle cx="245" cy="258" r="6" fill="#0D1424" stroke="url(#grad)" stroke-width="2.4"/>
  <circle cx="188" cy="196" r="6" fill="#0D1424" stroke="url(#grad)" stroke-width="2.4"/>

  <!-- アームが運ぶ書類 -->
  <g transform="rotate(-18 168 140)" stroke="url(#grad)" stroke-width="2" filter="url(#glow)">
    <rect x="140" y="118" width="52" height="34" rx="4" fill="rgba(34,211,238,0.10)"/>
  </g>

  <!-- 出力書類（処理済み） -->
  <g stroke="url(#grad)" stroke-width="2" stroke-linejoin="round" opacity="0.9" filter="url(#glow)">
    <rect x="352" y="252" width="58" height="34" rx="4" fill="rgba(34,211,238,0.08)"/>
  </g>
  <g stroke="#22D3EE" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M368,268 l9,10 l19,-22"/>
  </g>
</svg>
