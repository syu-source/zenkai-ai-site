<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-hidden="true" focusable="false">
  <title>IoT機器導入支援のイメージ図（センサー・電波・メーター）</title>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="90" cy="80" r="130" fill="url(#glowIndigo)"/>
  <circle cx="390" cy="300" r="150" fill="url(#glowCyan)"/>

  <path d="M0,0L0,360M40,0L40,360M80,0L80,360M120,0L120,360M160,0L160,360M200,0L200,360M240,0L240,360M280,0L280,360M320,0L320,360M360,0L360,360M400,0L400,360M440,0L440,360M480,0L480,360M0,0L480,0M0,40L480,40M0,80L480,80M0,120L480,120M0,160L480,160M0,200L480,200M0,240L480,240M0,280L480,280M0,320L480,320M0,360L480,360" stroke="#8B93F5" stroke-width="1" opacity="0.06"/>

  <!-- メッシュ接続 -->
  <g fill="none" stroke="url(#grad)" stroke-width="1.3" opacity="0.4" stroke-dasharray="2 6">
    <path d="M104,168 C160,140 200,120 234,104"/>
    <path d="M120,190 C200,220 280,232 322,210"/>
    <path d="M244,110 C280,150 300,180 320,206"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="234" cy="100" r="4" opacity="0.85"/>
    <circle cx="326" cy="212" r="4" opacity="0.85"/>
  </g>

  <!-- センサー本体 -->
  <g filter="url(#glow)">
    <rect x="66" y="150" width="52" height="42" rx="8" fill="rgba(99,102,241,0.12)" stroke="url(#grad)" stroke-width="2.2"/>
    <line x1="92" y1="150" x2="92" y2="118" stroke="url(#grad)" stroke-width="2.2"/>
    <circle cx="92" cy="112" r="6" fill="#0D1424" stroke="url(#grad)" stroke-width="2.2"/>
  </g>
  <g fill="none" stroke="url(#grad)" stroke-linecap="round">
    <path d="M74,92 a26,26 0 0 1 36,0" stroke-width="2" opacity="0.75"/>
    <path d="M62,78 a44,44 0 0 1 60,0" stroke-width="1.6" opacity="0.5"/>
    <path d="M50,64 a62,62 0 0 1 84,0" stroke-width="1.2" opacity="0.3"/>
  </g>
  <g stroke="#B4BDCF" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
    <line x1="78" y1="166" x2="106" y2="166"/>
    <line x1="78" y1="176" x2="98" y2="176"/>
  </g>

  <!-- メーター（可視化ダッシュボード） -->
  <g filter="url(#glow)">
    <path d="M292,300 a58,58 0 0 1 116,0" fill="none" stroke="url(#grad)" stroke-width="3"/>
  </g>
  <g stroke="#8B93F5" stroke-width="1.6" opacity="0.55">
    <line x1="298" y1="300" x2="308" y2="300"/>
    <line x1="350" y1="245" x2="350" y2="255"/>
    <line x1="402" y1="300" x2="392" y2="300"/>
  </g>
  <g stroke="url(#grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <line x1="350" y1="300" x2="380" y2="266"/>
  </g>
  <circle cx="350" cy="300" r="6" fill="#0D1424" stroke="url(#grad)" stroke-width="2.4"/>
  <rect x="322" y="316" width="56" height="20" rx="5" fill="rgba(34,211,238,0.10)" stroke="url(#grad)" stroke-width="1.6"/>
</svg>
