<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax meet" role="img" aria-hidden="true" focusable="false">
  <title>富士山ワイヤーフレーム（デジタルメッシュ）</title>
  <defs>
    <linearGradient id="fujiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B93F5" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="fujiGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05" />
    </linearGradient>
    <filter id="fujiGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .fj-dot { animation: fjPulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .fj-dot.d2 { animation-delay: 0.9s; }
      .fj-dot.d3 { animation-delay: 1.7s; }
      .fj-rise { animation: fjRise 7s linear infinite; }
      .fj-rise.r2 { animation-delay: 2.3s; }
      .fj-rise.r3 { animation-delay: 4.6s; }
      @keyframes fjPulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes fjRise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-110px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .fj-dot, .fj-rise { animation: none; } }
    </style>
  </defs>

  <!-- 稜線本体：実際の富士山のシルエット
       ・広い裾野／凹型（上に行くほど急）の斜面
       ・ほぼ水平だが小さな起伏のある山頂（火口縁、剣ヶ峰がやや高い） -->
  <g fill="none" stroke="url(#fujiGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#fujiGlow)">
    <path d="M140,380
             C380,366 520,336 584,272
             C636,220 656,150 668,108
             L684,98 L706,104 L726,92 L748,102 L772,98
             C784,150 804,220 856,272
             C920,336 1060,366 1300,380"
          stroke-width="2.6" />
    <!-- 雪形ライン（山頂直下、指状に垂れる雪の縁） -->
    <path d="M642,168 L664,140 L682,178 L702,148 L722,184 L742,152 L760,178 L780,148 L796,166"
          opacity="0.8" stroke-width="1.8" />
    <path d="M690,182 L687,214" opacity="0.45" stroke-width="1.4" />
    <path d="M742,188 L745,220" opacity="0.45" stroke-width="1.4" />
  </g>

  <!-- 内部ワイヤーフレーム（ローポリ三角メッシュ＝デジタル進化風） -->
  <g fill="none" stroke="url(#fujiGrad)" stroke-width="1" opacity="0.38">
    <path d="M668,108 L660,250 M684,98 L660,250 M726,92 L730,240 M706,104 L730,240 M772,98 L810,255 M748,102 L810,255
             M660,250 L730,240 L810,255
             M584,272 L660,250 M856,272 L810,255
             M660,250 L560,330 M660,250 L720,330 M730,240 L720,330 M810,255 L720,330 M810,255 L880,335
             M584,272 L560,330 M856,272 L880,335
             M560,330 L360,380 M560,330 L620,380 M720,330 L620,380 M720,330 L800,380 M880,335 L800,380 M880,335 L1010,380
             M856,272 L1000,350 L1300,380 M1000,350 L1080,380" />
  </g>

  <!-- メッシュ面のうっすら光る面（数枚だけ） -->
  <g stroke="none">
    <polygon points="706,104 726,92 730,240" fill="url(#fujiGradV)" opacity="0.34" />
    <polygon points="748,102 772,98 810,255" fill="url(#fujiGradV)" opacity="0.26" />
    <polygon points="668,108 684,98 660,250" fill="url(#fujiGradV)" opacity="0.22" />
    <polygon points="660,250 730,240 720,330" fill="url(#fujiGradV)" opacity="0.14" />
  </g>

  <!-- 水平線（ベースライン） -->
  <line x1="0" y1="380" x2="1440" y2="380" stroke="url(#fujiGrad)" stroke-width="1" opacity="0.22" />
  <!-- デジタル等高線（破線スキャンライン） -->
  <g stroke="url(#fujiGrad)" stroke-width="1" fill="none" opacity="0.20" stroke-dasharray="6 10">
    <path d="M340,330 L1100,330" />
    <path d="M470,270 L1000,270" />
    <path d="M560,200 L900,200" />
  </g>

  <!-- 頂点ノード（発光ドット、ゆっくり明滅） -->
  <g fill="#22D3EE">
    <circle class="fj-dot" cx="726" cy="92" r="3" />
    <circle class="fj-dot d2" cx="668" cy="108" r="2" />
    <circle class="fj-dot d3" cx="772" cy="98" r="2" />
    <circle class="fj-dot d2" cx="584" cy="272" r="1.8" opacity="0.7" />
    <circle class="fj-dot d3" cx="856" cy="272" r="1.8" opacity="0.7" />
    <circle class="fj-dot" cx="660" cy="250" r="1.6" opacity="0.6" />
    <circle class="fj-dot d2" cx="730" cy="240" r="1.6" opacity="0.6" />
    <circle class="fj-dot d3" cx="810" cy="255" r="1.6" opacity="0.6" />
    <circle class="fj-dot" cx="720" cy="330" r="1.4" opacity="0.5" />
    <circle class="fj-dot d3" cx="1000" cy="350" r="1.4" opacity="0.5" />
  </g>

  <!-- 進化エフェクト：山頂から立ち上るデータ粒子 -->
  <g fill="#8B93F5">
    <circle class="fj-rise" cx="716" cy="84" r="1.8" />
    <circle class="fj-rise r2" cx="752" cy="90" r="1.4" />
    <circle class="fj-rise r3" cx="694" cy="92" r="1.2" />
  </g>
</svg>
