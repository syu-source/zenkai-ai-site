<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-hidden="true" focusable="false">
  <title>不動産AI活用パックのイメージ図（ビル群・AI応答・査定グラフ）</title>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="80" cy="90" r="130" fill="url(#glowIndigo)"/>
  <circle cx="410" cy="300" r="150" fill="url(#glowCyan)"/>

  <path d="M0,0L0,360M40,0L40,360M80,0L80,360M120,0L120,360M160,0L160,360M200,0L200,360M240,0L240,360M280,0L280,360M320,0L320,360M360,0L360,360M400,0L400,360M440,0L440,360M480,0L480,360M0,0L480,0M0,40L480,40M0,80L480,80M0,120L480,120M0,160L480,160M0,200L480,200M0,240L480,240M0,280L480,280M0,320L480,320M0,360L480,360" stroke="#8B93F5" stroke-width="1" opacity="0.06"/>

  <!-- 街並み -->
  <line x1="30" y1="304" x2="450" y2="304" stroke="url(#grad)" stroke-width="1.4" opacity="0.35"/>
  <g stroke="url(#grad)" stroke-width="2" fill="rgba(99,102,241,0.08)">
    <rect x="48" y="176" width="56" height="128" rx="4"/>
    <rect x="112" y="212" width="52" height="92" rx="4"/>
    <rect x="172" y="242" width="46" height="62" rx="4"/>
  </g>
  <g stroke="#B4BDCF" stroke-width="1" opacity="0.4">
    <path d="M60,192h32M60,208h32M60,224h32M60,240h32M60,256h32M60,272h32M60,288h32"/>
    <path d="M122,228h32M122,244h32M122,260h32M122,276h32M122,292h32"/>
  </g>
  <circle cx="76" cy="176" r="2.6" fill="#22D3EE" opacity="0.8"/>

  <!-- AI吹き出し -->
  <g filter="url(#glow)">
    <path d="M232,52 h198 a14,14 0 0 1 14,14 v70 a14,14 0 0 1 -14,14 h-140 l-30,26 v-26 h-28 a14,14 0 0 1 -14,-14 v-70 a14,14 0 0 1 14,-14 z"
          fill="rgba(99,102,241,0.10)" stroke="url(#grad)" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g stroke="#B4BDCF" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="254" y1="86" x2="368" y2="86"/>
    <line x1="254" y1="104" x2="392" y2="104"/>
    <line x1="254" y1="122" x2="330" y2="122"/>
  </g>
  <circle cx="404" cy="86" r="3" fill="#22D3EE"/>

  <!-- 査定トレンドグラフ -->
  <g filter="url(#glow)">
    <polyline points="264,286 302,266 340,272 378,236 416,214" fill="none" stroke="url(#grad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#0D1424" stroke="url(#grad)" stroke-width="2">
    <circle cx="264" cy="286" r="4"/>
    <circle cx="302" cy="266" r="4"/>
    <circle cx="340" cy="272" r="4"/>
    <circle cx="378" cy="236" r="4"/>
  </g>
  <circle cx="416" cy="214" r="6" fill="#0D1424" stroke="url(#grad)" stroke-width="2.6" filter="url(#glow)"/>
  <circle cx="416" cy="214" r="2.4" fill="#22D3EE"/>
</svg>
